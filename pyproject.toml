[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-provider-news"
dynamic = ["version"]
description = "OVOS MediaProvider plugin for broadcast news feeds (replaces ovos-skill-news)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "OpenVoiceOS", "OCP", "media", "news", "radio", "MediaProvider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mediavocab>=1.0.0",
    "ovos-plugin-manager>=2.8.0a1,<3.0.0",
    "ovos-utils>=0.3.5",
    "langcodes",
    "ovos-ocp-rss-plugin>=0.1.2",
    "ovos-ocp-news-plugin>=0.1.2",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-provider-news"
Source = "https://github.com/OpenVoiceOS/ovos-media-provider-news"

[project.entry-points."opm.media.provider"]
news = "ovos_media_provider_news:NewsMediaProvider"

[tool.setuptools]
packages = ["ovos_media_provider_news"]

[tool.setuptools.package-data]
ovos_media_provider_news = ["News.json"]

[tool.setuptools.dynamic]
version = { attr = "ovos_media_provider_news.version.__version__" }
